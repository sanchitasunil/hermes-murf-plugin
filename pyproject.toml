[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-plugin-murf-tts"
version = "1.0.1"
description = "Murf Falcon streaming TTS backend for Hermes, with a persistent multi-sentence live session mode"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "sanchitasunil" }]
requires-python = ">=3.10"
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "websockets>=12",
]

[project.urls]
Homepage = "https://github.com/sanchitasunil/hermes-murf-plugin"
Repository = "https://github.com/sanchitasunil/hermes-murf-plugin"

[project.entry-points."hermes_agent.plugins"]
murf-tts = "hermes_murf_plugin"

[tool.setuptools.packages.find]
where = ["src"]
